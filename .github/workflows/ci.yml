name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev extras
        run: uv sync --frozen --extra dev
      - name: Compile check
        run: uv run python -m compileall codex_shim/ -q
      - name: Net invariant lint
        run: uv run python lint/net_invariants.py
      - name: Smoke script syntax
        run: |
          bash -n scripts/smoke_chatgpt_passthrough.sh
          bash -n scripts/smoke_opencode_free.sh
          bash -n scripts/smoke_net_surfaces.sh
          bash -n scripts/codex_exec_smoke.sh
      - name: Ruff
        run: uv run ruff check codex_shim lint tests
      - name: Run tests
        run: uv run pytest tests/ -q --cov=codex_shim --cov-fail-under=95
